<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styleeb.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

    <div class="max-w-4xl mx-auto px-4 py-6 sm:py-10">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-wallet text-indigo-600 dark:text-indigo-400"></i> ExpenseVisualizer
                </h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Track your daily spending and budget seamlessly.</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="monthlySummaryBtn" class="px-3 py-2 text-sm font-medium bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-calendar-days text-indigo-500"></i> <span class="hidden sm:inline">Monthly Summary</span>
                </button>
                <button id="themeToggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm" aria-label="Toggle Theme">
                    <i id="themeIcon" class="fa-solid fa-moon text-slate-600 dark:text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- Budget & Total Balance Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 relative overflow-hidden">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Total Balance / Spent</p>
                        <h2 id="totalBalance" class="text-3xl font-extrabold text-slate-900 dark:text-white mt-1">$0.00</h2>
                    </div>
                    <div class="p-3 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-xl">
                        <i class="fa-solid fa-chart-pie text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Monthly Budget Limit</p>
                    <button id="editBudgetBtn" class="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Set Limit</button>
                </div>
                <div class="flex items-baseline justify-between">
                    <h2 id="budgetLimitDisplay" class="text-2xl font-extrabold text-slate-900 dark:text-white">$500.00</h2>
                    <span id="budgetStatusText" class="text-xs font-medium text-emerald-500">On Track</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full mt-3 overflow-hidden">
                    <div id="budgetProgressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <!-- Limit Warning Alert Area -->
                <div id="budgetAlert" class="hidden mt-2 text-xs font-medium text-rose-500 flex items-center gap-1">
                    <i class="fa-solid fa-triangle-exclamation"></i> Budget limit reached or exceeded!
                </div>
            </div>
        </div>

        <!-- Main Content Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Input Form & Chart -->
            <div class="lg:col-span-5 space-y-6">
                <!-- Transaction Form Card -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <h3 class="text-lg font-semibold text-slate-800 dark:text-white mb-4">Add Transaction</h3>
                    
                    <form id="transactionForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Item Name</label>
                            <input type="text" id="itemName" required placeholder="e.g., Grocery Shopping" 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Amount ($)</label>
                            <input type="number" step="0.01" id="itemAmount" required placeholder="0.00" 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Category</label>
                                <button type="button" id="addCategoryBtn" class="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline">+ Add Custom</button>
                            </div>
                            <select id="itemCategory" required 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Fun">Fun</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Date</label>
                            <input type="date" id="itemDate" required 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        </div>

                        <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md shadow-indigo-200 dark:shadow-none transition duration-200 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> Add Transaction
                        </button>
                    </form>
                </div>

                <!-- Visual Chart Card -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <h3 class="text-lg font-semibold text-slate-800 dark:text-white mb-4">Spending Distribution</h3>
                    <!-- Chart container wrapper fixing canvas dimensions -->
                    <div class="chart-container">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Right Column: Transaction List & Controls -->
            <div class="lg:col-span-7 flex flex-col">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex-1 flex flex-col">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <h3 class="text-lg font-semibold text-slate-800 dark:text-white">Transaction History</h3>
                        
                        <!-- Sorting & Filtering Controls -->
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <select id="sortSelect" class="text-xs px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none">
                                <option value="date-desc">Newest First</option>
                                <option value="date-asc">Oldest First</option>
                                <option value="amount-desc">Highest Amount</option>
                                <option value="amount-asc">Lowest Amount</option>
                                <option value="category">Category</option>
                            </select>
                        </div>
                    </div>

                    <!-- Scrollable Transaction List -->
                    <div id="transactionListContainer" class="flex-1 overflow-y-auto max-h-[500px] space-y-3 pr-1">
                        <!-- Dynamically populated items will appear here -->
                        <div id="emptyState" class="text-center py-12 text-slate-400 dark:text-slate-500">
                            <i class="fa-solid fa-receipt text-4xl mb-2 opacity-50"></i>
                            <p class="text-sm">No transactions added yet.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Monthly Summary Modal -->
    <div id="summaryModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700 animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Monthly Summary</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="mb-4">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Select Month</label>
                <input type="month" id="summaryMonthInput" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none">
            </div>

            <div id="summaryContent" class="space-y-3 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50">
                <!-- Populated via script -->
            </div>

            <button id="closeSummaryAction" class="w-full mt-5 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 font-semibold rounded-xl transition">
                Close
            </button>
        </div>
    </div>

    <!-- Custom Category Modal -->
    <div id="categoryModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-xs w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700">
            <h3 class="text-md font-bold text-slate-900 dark:text-white mb-3">Add Custom Category</h3>
            <input type="text" id="newCategoryInput" placeholder="Category Name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none mb-4">
            <div class="flex gap-2">
                <button id="cancelCategoryBtn" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold rounded-xl">Cancel</button>
                <button id="saveCategoryBtn" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl">Save</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="js/scripteb.js"></script>
</body>
</html>
